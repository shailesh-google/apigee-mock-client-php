name: Tests

on: [push, pull_request]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5]
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv
          coverage: none
          # Since you are testing cutting-edge PHP 8.5, 
          # ignore deprecations so your build doesn't fail on third-party code.
          ini-values: error_reporting=E_ALL & ~E_DEPRECATED

      - name: Install Dependencies
        run: |
          composer update --${{ matrix.dependency-version }} --no-interaction --no-progress --ignore-platform-req=php+

      - name: Run Tests
        run: ./vendor/bin/phpunit